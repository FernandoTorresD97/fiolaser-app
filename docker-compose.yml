x-app: &app
  build: ./backend
  image: fiolaser-app:local
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  env_file:
    - path: .env
      required: false
  environment: &environment
    DB_HOST: postgres
    DB_PASSWORD: ${DB_PASSWORD:-changeit}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    FRONTEND_URL: http://localhost:5500
    PUBLIC_BASE_URL: http://localhost:5500
    SMTP_HOST: mailpit
    SMTP_PORT: 1025

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fiolaser
      POSTGRES_USER: fiolaser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeit}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [fiolaser_pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiolaser"]
      interval: 5s
      timeout: 5s
      retries: 10
  kafka:
    image: apache/kafka:3.8.0
    ports: ["127.0.0.1:9092:19092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
  backend:
    <<: *app
    ports: ["127.0.0.1:${BACKEND_PORT:-18080}:8080"]
  notification-service:
    <<: *app
    environment:
      <<: *environment
      NOTIFICATIONS_ENABLED: "true"
      OUTBOX_ENABLED: "false"
      ADMIN_BOOTSTRAP_EMAIL: ""
      ADMIN_BOOTSTRAP_PASSWORD: ""
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
  mailpit:
    image: axllent/mailpit:v1.20
    ports: ["127.0.0.1:8025:8025"]
  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:5500:80"]
volumes:
  fiolaser_pg_data:
