<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Minha conta — Fiolaser</title><link rel="stylesheet" href="css/style.css"></head>
<body><div id="header-fiolaser"></div><main class="auth-wrap"><section class="auth-card"><h1>Minha conta</h1>
<p id="account-description"></p><a class="btn btn-secundario" href="meus-agendamentos.html">Meus agendamentos</a>
<h2 style="margin-top:24px">Trocar senha</h2><form id="password-form">
<div class="campo"><label for="current-password">Senha atual</label><input id="current-password" type="password" autocomplete="current-password" required></div>
<div class="campo"><label for="new-password">Nova senha</label><input id="new-password" type="password" autocomplete="new-password" minlength="10" maxlength="72" required><small>Pelo menos 10 caracteres.</small></div>
<div class="campo"><label for="confirm-password">Confirme a nova senha</label><input id="confirm-password" type="password" autocomplete="new-password" required></div>
<button class="btn btn-primario">Trocar senha</button></form><p id="account-status" role="status"></p></section></main><div id="footer-fiolaser"></div>
<script src="js/config.js"></script><script src="js/main.js"></script><script src="js/account.js"></script></body></html>
