<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Completar cadastro — Fiolaser</title><link rel="stylesheet" href="css/style.css"></head>
<body><div id="header-fiolaser"></div><main class="auth-wrap"><section class="auth-card"><h1>Complete seu cadastro</h1>
<p>Informe seus dados para reservar um atendimento.</p><form id="profile-form">
<div class="campo"><label for="cpf">CPF</label><input id="cpf" required maxlength="14" autocomplete="off"></div>
<div class="campo"><label for="birth">Data de nascimento</label><input id="birth" type="date" required></div>
<div class="campo"><label for="phone">Telefone (opcional)</label><input id="phone" type="tel" maxlength="20" autocomplete="tel"></div>
<button class="btn btn-primario">Salvar e continuar</button></form><p id="profile-status" role="status"></p></section></main><div id="footer-fiolaser"></div>
<script src="js/config.js"></script><script src="js/main.js"></script><script src="js/profile.js"></script></body></html>
