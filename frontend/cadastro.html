<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — Fiolaser Cruz das Almas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cadastro">

<div id="header-fiolaser"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h2 style="margin-bottom:6px;">Criar sua conta</h2>
    <p style="color:var(--cinza);font-size:0.9rem;margin-bottom:20px;">Leva menos de 2 minutos.</p>

    <a class="btn btn-google btn-bloco" href="#" onclick="loginComGoogle(); return false;">
      Continuar com Google
    </a>
    <div class="divisor">ou com e-mail e número</div>

    <div class="msg-erro" id="msg-erro"></div>

    <form id="form-cadastro">
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" required>
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email">
      </div>
      <div class="campo">
        <label for="telefone">Número (WhatsApp)</label>
        <input type="tel" id="telefone" placeholder="(75) 90000-0000">
        <small>Preencha e-mail e/ou número.</small>
      </div>
      <div class="campo">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" required>
        <small>Usado apenas para identificação do seu cadastro. Armazenado com segurança.</small>
      </div>
      <div class="campo">
        <label for="nascimento">Data de nascimento</label>
        <input type="date" id="nascimento" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" minlength="10" maxlength="72" required>
      </div>
      <button type="submit" class="btn btn-primario btn-bloco">Criar conta</button>
    </form>

    <p style="text-align:center; margin-top:18px; font-size:0.9rem;">
      Já tem conta? <a href="login.html" style="color:var(--vermelho); font-weight:600;">Entrar</a>
    </p>
  </div>
</div>

<div id="footer-fiolaser"></div>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script>
document.getElementById("form-cadastro").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msgErro = document.getElementById("msg-erro");
  msgErro.style.display = "none";

  try {
    const resp = await apiFetch("/api/auth/registrar", {
      method: "POST",
      body: JSON.stringify({
        nomeCompleto: document.getElementById("nome").value,
        email: document.getElementById("email").value || null,
        telefone: document.getElementById("telefone").value || null,
        cpf: document.getElementById("cpf").value,
        dataNascimento: document.getElementById("nascimento").value,
        senha: document.getElementById("senha").value
      })
    });
    sessionStorage.setItem("fiolaser_token", resp.token);
    sessionStorage.setItem("fiolaser_nome", resp.nomeCompleto);
    sessionStorage.setItem("fiolaser_role", resp.role);
    window.location.href = "agendamento.html";
  } catch (err) {
    msgErro.textContent = err.message;
    msgErro.style.display = "block";
  }
});

function loginComGoogle() {
  window.location.href = `${API_BASE}/oauth2/authorization/google`;
}
</script>
</body>
</html>
